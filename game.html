<!doctype html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DUEL / 2P Arena</title>
	<style>
		:root { --ink:#f2f4f1; --muted:#98a29f; --line:#2d3937; --bg:#101615; --panel:#17201f; --orange:#ff734d; --cyan:#55d6ce; }
		* { box-sizing:border-box; }
		body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% -10%, #263b37 0, var(--bg) 46%); color:var(--ink); font-family:Georgia, 'Times New Roman', serif; display:flex; justify-content:center; padding:28px 18px 36px; }
		main { width:min(1180px, 100%); }
		header { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:22px; }
		.eyebrow { color:var(--orange); font:700 11px/1.2 'Courier New', monospace; letter-spacing:3px; margin-bottom:8px; }
		h1 { font-size:clamp(34px, 6vw, 68px); line-height:.9; margin:0; letter-spacing:-3px; }
		.subtitle { color:var(--muted); max-width:300px; font:12px/1.6 'Courier New', monospace; text-align:right; }
		.scoreboard { display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center; background:rgba(23,32,31,.85); border:1px solid var(--line); padding:13px 18px; }
		.score { display:flex; align-items:center; gap:12px; font:700 12px 'Courier New', monospace; letter-spacing:1px; }
		.score.right { justify-content:flex-end; }
		.dot { width:10px; height:10px; border-radius:50%; display:inline-block; box-shadow:0 0 14px currentColor; }
		.p1 { color:var(--orange); } .p2 { color:var(--cyan); }
		.health { height:7px; flex:1; max-width:220px; background:#29302f; overflow:hidden; }
		.health i { display:block; height:100%; width:100%; background:currentColor; transition:width .15s ease; }
		.versus { color:#6e7a77; font:700 11px 'Courier New', monospace; }
		#game-shell { position:relative; margin-top:14px; border:1px solid var(--line); background:#111918; box-shadow:0 22px 60px rgba(0,0,0,.3); }
		canvas { display:block; width:100%; height:auto; aspect-ratio:1100/620; }
		#overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(9,14,13,.72); opacity:0; pointer-events:none; transition:opacity .2s; }
		#overlay.show { opacity:1; pointer-events:auto; }
		#select-screen { position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; background:rgba(5,10,11,.94); padding:20px; }
		#select-screen.hidden { display:none; }
		.select-box { width:min(900px,100%); text-align:center; }
		.select-box h2 { margin:0 0 6px; font-size:clamp(25px,4vw,42px); color:#effffc; text-shadow:0 0 18px #55d6ce; }
		.select-box > p { color:var(--muted); margin:0 0 20px; font:11px 'Courier New',monospace; }
		.pickers { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
		.picker { border:1px solid var(--line); padding:14px; background:#121b1b; }
		.picker h3 { margin:0 0 12px; font:700 12px 'Courier New',monospace; letter-spacing:2px; }
		.ability-list { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
		.ability { border:1px solid #344541; background:#1b2826; color:var(--ink); text-align:left; padding:10px; cursor:pointer; min-height:82px; }
		.ability:hover,.ability.selected { border-color:var(--cyan); box-shadow:0 0 16px #55d6ce44; background:#243532; }
		.ability strong { display:block; font:700 12px Georgia,serif; margin-bottom:4px; }
		.ability span { display:block; color:var(--muted); font:10px/1.4 'Courier New',monospace; }
		#start-game { margin-top:18px; min-width:160px; background:var(--cyan); color:#071313; box-shadow:0 0 18px #55d6ce66; }
		.ult { color:#f5fffd; font:10px 'Courier New',monospace; margin-left:8px; }
		@media (max-width:640px) { .pickers { grid-template-columns:1fr; max-height:62vh; overflow:auto; } .ability { min-height:68px; } }
		.result { text-align:center; background:#17211f; border:1px solid #52625d; padding:28px 42px; box-shadow:0 15px 40px #0008; }
		.result small { color:var(--orange); font:11px 'Courier New', monospace; letter-spacing:2px; }
		.result h2 { font-size:38px; margin:8px 0 18px; }
		button { cursor:pointer; border:0; padding:11px 18px; background:var(--orange); color:#17100d; font:700 12px 'Courier New', monospace; }
		.instructions { display:grid; grid-template-columns:1fr 1fr; gap:1px; margin-top:14px; background:var(--line); border:1px solid var(--line); }
		.instructions section { background:var(--panel); padding:17px 20px; display:flex; justify-content:space-between; align-items:center; }
		.instructions section:last-child { text-align:right; flex-direction:row-reverse; }
		.instructions b { font-size:22px; } .instructions p { margin:0; color:var(--muted); font:11px/1.6 'Courier New', monospace; }
		kbd { border:1px solid #52605d; padding:3px 5px; color:var(--ink); font:11px 'Courier New', monospace; background:#202b29; }
		@media (max-width:640px) { body { padding:18px 10px 24px; } header { align-items:start; flex-direction:column; gap:10px; } .subtitle { text-align:left; } .scoreboard { padding:11px 9px; gap:7px; } .score { font-size:10px; gap:6px; } .health { max-width:85px; } .instructions section { padding:12px 10px; } .instructions p { font-size:9px; } }
	</style>
</head>
<body>
	<main>
		<header>
			<div><div class="eyebrow">LOCAL MULTIPLAYER / 01</div><h1>DUEL<br>ARENA</h1></div>
			<div class="subtitle">두 명의 파일럿, 하나의 경기장.<br>벽은 막지만 총알은 막지 못합니다.</div>
		</header>
		<div class="scoreboard">
			<div class="score p1"><span class="dot" style="background:currentColor"></span><span>P1</span><div class="health"><i id="health1"></i></div><strong id="value1">100</strong></div>
			<div class="versus">VS</div>
			<div class="score right p2"><strong id="value2">100</strong><div class="health"><i id="health2"></i></div><span>P2</span><span class="dot" style="background:currentColor"></span></div>
		</div>
		<div id="game-shell">
			<canvas id="arena" width="1100" height="620" aria-label="2인용 대전 게임 화면"></canvas>
			<div id="select-screen"><div class="select-box"><h2>CHOOSE YOUR EDGE</h2><p>각 플레이어가 능력을 하나씩 선택하세요 · P1 필살기 M / P2 필살기 +</p><div class="pickers"><div class="picker p1"><h3>P1 LOADOUT</h3><div class="ability-list" data-player="p1"></div></div><div class="picker p2"><h3>P2 LOADOUT</h3><div class="ability-list" data-player="p2"></div></div></div><button id="start-game">ENTER ARENA</button></div></div>
			<div id="overlay"><div class="result"><small>MATCH COMPLETE</small><h2 id="winner">P1 WINS</h2><button id="restart">REMATCH ↵</button></div></div>
		</div>
		<div class="instructions">
			<section><b class="p1">P1</b><p>이동 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd><br>발사 <kbd>SPACE</kbd></p></section>
			<section><b class="p2">P2</b><p>이동 <kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd><br>발사 <kbd>ENTER</kbd></p></section>
		</div>
	</main>
	<script>
		const canvas = document.getElementById('arena'), ctx = canvas.getContext('2d');
		const W=canvas.width, H=canvas.height, wall=550, keys=new Set(), bullets=[], trails=[], effects=[], cannons=[];
		const MAX_BULLETS=100, MAX_TRAILS=90, MAX_EFFECTS=100;
		let last=performance.now(), running=false, shake=0, camera={x:W/2,y:H/2,zoom:1};
		const abilities={
			invincible:{name:'무적',color:'#f7e36b',description:'5초 동안 모든 피해를 무시합니다.'},
			awakening:{name:'각성',color:'#ff5ce1',description:'5초 동안 가속, 관통, 총알 피해 10.'},
			cannon:{name:'대포',color:'#ff9f43',description:'위치에 10초 대포를 설치해 자동 발사합니다.'},
			sniper:{name:'명사수',color:'#b78cff',description:'투명화, 확대 조준. 정확히 맞추면 50 피해.'}
		};
		const players={p1:{x:150,y:H/2,color:'#ff734d',baseColor:'#ff734d',hp:100,fire:' ',ult:'m',controls:['a','d','w','s'],dir:1,ability:null},p2:{x:W-150,y:H/2,color:'#55d6ce',baseColor:'#55d6ce',hp:100,fire:'enter',ult:'+',controls:['arrowleft','arrowright','arrowup','arrowdown'],dir:-1,ability:null}};
		const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
		function makePickers(){for(const id of ['p1','p2']){const box=document.querySelector(`[data-player="${id}"]`); for(const [key,a] of Object.entries(abilities)){const button=document.createElement('button');button.className='ability';button.dataset.ability=key;button.innerHTML=`<strong>${a.name}</strong><span>${a.description}</span>`;button.addEventListener('click',()=>{box.querySelectorAll('.ability').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');players[id].ability=key;});box.appendChild(button);}}}
		function reset(){players.p1.x=150;players.p1.y=H/2;players.p1.hp=100;players.p1.lastShot=0;players.p1.special=null;players.p2.x=W-150;players.p2.y=H/2;players.p2.hp=100;players.p2.lastShot=0;players.p2.special=null;bullets.length=0;trails.length=0;effects.length=0;cannons.length=0;running=false;document.getElementById('overlay').classList.remove('show');document.getElementById('select-screen').classList.remove('hidden');updateHealth();}
		function startGame(){if(!players.p1.ability||!players.p2.ability)return;players.p1.color=players.p1.baseColor;players.p2.color=players.p2.baseColor;running=true;document.getElementById('select-screen').classList.add('hidden');}
		document.addEventListener('keydown',e=>{const key=e.key.toLowerCase();keys.add(key);if([' ','arrowup','arrowdown','arrowleft','arrowright','enter','+','='].includes(key))e.preventDefault();if(!e.repeat&&running){if(key==='m')activate(players.p1);if((key==='+'||key==='=')&&players.p2.ability)activate(players.p2);if(key===players.p1.fire)shoot(players.p1,performance.now());if(key===players.p2.fire)shoot(players.p2,performance.now());}});
		document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
		document.getElementById('start-game').addEventListener('click',startGame);document.getElementById('restart').addEventListener('click',reset);makePickers();
		function updateHealth(){for(const [id,p] of Object.entries(players)){document.getElementById('health'+id.slice(1)).style.width=p.hp+'%';document.getElementById('value'+id.slice(1)).textContent=p.hp;document.querySelector('.score.'+id+' .dot')?.style.setProperty('background',p.color);}}
		function activate(p){if(p.special)return;p.color=abilities[p.ability].color;updateHealth();if(p.ability==='invincible'||p.ability==='awakening'){p.special={type:p.ability,time:5};}else if(p.ability==='cannon'){cannons.push({x:p.x,y:p.y,owner:p,life:10,lastShot:0});p.special={type:'cannon',time:10};}else if(p.ability==='sniper'){p.special={type:'sniper',time:5,alpha:1,zoom:1,cameraX:players[p===players.p1?'p2':'p1'].x,cameraY:players[p===players.p1?'p2':'p1'].y};}effects.push({type:'burst',x:p.x,y:p.y,color:p.color,life:.5,maxLife:.5});}
		function shoot(p,now){if(p.special?.type==='sniper'){const target=p===players.p1?players.p2:players.p1;const aligned=Math.hypot(target.x-p.special.cameraX,target.y-p.special.cameraY)<30;if(aligned){target.hp=Math.max(0,target.hp-50);shake=70;updateHealth();if(target.hp===0)end(p===players.p1?'P1 WINS':'P2 WINS');}p.special=null;p.color=p.baseColor;return;}if(bullets.length>=MAX_BULLETS)return;const piercing=p.special?.type==='awakening';const damage=piercing?10:5;shake=Math.max(shake,28);const x=p.x+p.dir*27;bullets.push({x,y:p.y,dir:p.dir,color:p.color,damage,piercing,owner:p});if(effects.length<MAX_EFFECTS){effects.push({type:'flash',x,y:p.y,dir:p.dir,color:p.color,life:.12,maxLife:.12});for(let i=0;i<4;i++)effects.push({type:'spark',x,y:p.y,vx:p.dir*(90+Math.random()*180),vy:(Math.random()-.5)*180,life:.3,maxLife:.4,radius:2+Math.random()*3,color:p.color});}}
		function hit(b,p){return Math.abs(b.x-p.x)<24&&Math.abs(b.y-p.y)<25;}
		function update(dt,now){for(const p of Object.values(players)){const oldX=p.x,oldY=p.y,speed=p.special?.type==='awakening'?520:320;const [l,r,u,d]=p.controls;if(p.special?.type==='sniper'){if(keys.has(l))p.special.cameraX-=220*dt;if(keys.has(r))p.special.cameraX+=220*dt;if(keys.has(u))p.special.cameraY-=220*dt;if(keys.has(d))p.special.cameraY+=220*dt;p.special.cameraX=clamp(p.special.cameraX,40,W-40);p.special.cameraY=clamp(p.special.cameraY,40,H-40);p.special.alpha=Math.max(0,p.special.alpha-dt*1.5);p.special.zoom=Math.min(1.45,p.special.zoom+dt*5);p.special.time-=dt;if(p.special.time<=0){p.special=null;p.color=p.baseColor;}}else{if(keys.has(l))p.x-=speed*dt;if(keys.has(r))p.x+=speed*dt;if(keys.has(u))p.y-=speed*dt;if(keys.has(d))p.y+=speed*dt;p.x=clamp(p.x,p===players.p1?35:wall+35,p===players.p1?wall-35:W-35);p.y=clamp(p.y,35,H-35);if(Math.abs(p.x-oldX)+Math.abs(p.y-oldY)>.1)trails.push({x:oldX,y:oldY,color:p.color,life:.28,maxLife:.28});}if(p.special&&p.special.type!=='sniper'){p.special.time-=dt;if(p.special.time<=0){p.special=null;p.color=p.baseColor;}}}
			for(const cannon of cannons){cannon.life-=dt;if(cannon.life<=0){cannons.splice(cannons.indexOf(cannon),1);continue;}cannon.lastShot-=dt;if(cannon.lastShot<=0){const target=cannon.owner===players.p1?players.p2:players.p1;const angle=Math.atan2(target.y-cannon.y,target.x-cannon.x);bullets.push({x:cannon.x,y:cannon.y,vx:Math.cos(angle)*620,vy:Math.sin(angle)*620,dir:0,color:'#ff9f43',damage:5,cannon:true,owner:cannon.owner});cannon.lastShot=.9;}}
			for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=(b.vx??b.dir*960)*dt;b.y+=(b.vy??0)*dt;let blocked=false;for(let j=i-1;j>=0;j--){const o=bullets[j];if(!b.cannon&&!o.cannon&&!b.piercing&&!o.piercing&&b.dir!==o.dir&&Math.abs(b.x-o.x)<28&&Math.abs(b.y-o.y)<8){bullets.splice(i,1);bullets.splice(j,1);blocked=true;break;}}if(blocked){i=bullets.length;continue;}const target=b.owner===players.p1?players.p2:players.p1;if(hit(b,target)){if(!target.special||!['invincible','sniper'].includes(target.special.type)){target.hp=Math.max(0,target.hp-b.damage);updateHealth();if(target.hp===0)end(b.owner===players.p1?'P1 WINS':'P2 WINS');}if(!b.piercing)bullets.splice(i,1);}else if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30)bullets.splice(i,1);}
			for(let i=trails.length-1;i>=0;i--){trails[i].life-=dt;if(trails[i].life<=0)trails.splice(i,1);}if(trails.length>MAX_TRAILS)trails.splice(0,trails.length-MAX_TRAILS);for(let i=effects.length-1;i>=0;i--){const effect=effects[i];effect.life-=dt;if(effect.vx){effect.x+=effect.vx*dt;effect.y+=effect.vy*dt;effect.vx*=.94;effect.vy*=.94;}if(effect.life<=0)effects.splice(i,1);}}
		function end(text){running=false;document.getElementById('winner').textContent=text;document.getElementById('overlay').classList.add('show');}
		function draw(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.8;}ctx.fillStyle='#111918';ctx.fillRect(0,0,W,H);const sniper=players.p1.special?.type==='sniper'?players.p1:players.p2.special?.type==='sniper'?players.p2:null;if(sniper){camera.x=sniper.special.cameraX;camera.y=sniper.special.cameraY;camera.zoom=sniper.special.zoom;}else{camera.x=W/2;camera.y=H/2;camera.zoom=1;}ctx.translate(W/2,H/2);ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);ctx.strokeStyle='#1d2a28';ctx.lineWidth=1;for(let x=0;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.fillStyle='#273633';ctx.fillRect(wall-6,0,12,H);ctx.fillStyle='#435650';ctx.fillRect(wall-2,0,4,H);for(let y=18;y<H;y+=42){ctx.fillStyle='#9aafaa';ctx.fillRect(wall-1,y,2,12);}for(const trail of trails){ctx.globalAlpha=trail.life/trail.maxLife*.28;ctx.fillStyle=trail.color;ctx.beginPath();ctx.arc(trail.x,trail.y,22,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}for(const cannon of cannons){ctx.fillStyle='#ff9f43';ctx.shadowColor='#ff9f43';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(cannon.x,cannon.y,18,0,Math.PI*2);ctx.fill();ctx.fillRect(cannon.x-7,cannon.y-28,14,35);ctx.shadowBlur=0;}for(const effect of effects){const opacity=effect.life/effect.maxLife;ctx.globalAlpha=opacity;ctx.fillStyle=effect.color;ctx.shadowColor=effect.color;ctx.shadowBlur=effect.type==='flash'?10:4;if(effect.type==='flash'||effect.type==='burst'){ctx.beginPath();ctx.arc(effect.x,effect.y,18+opacity*18,0,Math.PI*2);ctx.fill();}else{ctx.beginPath();ctx.arc(effect.x,effect.y,effect.radius*opacity,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;ctx.globalAlpha=1;}for(const b of bullets){ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=6;if(b.cannon){ctx.beginPath();ctx.arc(b.x,b.y,7,0,Math.PI*2);ctx.fill();}else ctx.fillRect(b.x-14,b.y-3,28,6);ctx.shadowBlur=0;}for(const p of Object.values(players)){if(p.special?.type==='sniper'&&p.special.alpha<=.05)continue;ctx.save();ctx.globalAlpha=p.special?.type==='sniper'?p.special.alpha:1;ctx.translate(p.x,p.y);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#101615';ctx.beginPath();ctx.arc(p.dir*7,-6,4,0,Math.PI*2);ctx.fill();ctx.fillRect(p.dir*14-(p.dir>0?0:28),-4,28,8);ctx.restore();}ctx.fillStyle='#667873';ctx.font='11px Courier New';ctx.textAlign='center';ctx.fillText('NO CROSSING',wall,H-18);ctx.restore();if(sniper){ctx.save();ctx.strokeStyle=abilities.sniper.color;ctx.shadowColor=abilities.sniper.color;ctx.shadowBlur=6;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2-35,H/2);ctx.lineTo(W/2+35,H/2);ctx.moveTo(W/2,H/2-35);ctx.lineTo(W/2,H/2+35);ctx.stroke();ctx.restore();}}
		function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;if(running)update(dt,now);draw();requestAnimationFrame(loop);}updateHealth();requestAnimationFrame(loop);
	</script>
</body>
</html>
