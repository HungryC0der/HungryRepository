<!doctype html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DUEL / 2P Arena</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
		:root { --ink:#f2f4f1; --muted:#98a29f; --line:#2d3937; --bg:#101615; --panel:#17201f; --orange:#ff734d; --cyan:#55d6ce; }
		* { box-sizing:border-box; }
		body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% -10%, #263b37 0, var(--bg) 46%); color:var(--ink); font-family:'Noto Sans KR',sans-serif; font-weight:500; display:flex; justify-content:center; padding:28px 18px 36px; }
		main { width:min(1400px, 100%); }
		header { display:flex; justify-content:space-between; align-items:end; gap:20px; }
		.game-brand { display:none; }
		.eyebrow { color:var(--orange); font:700 11px/1.2 'Courier New', monospace; letter-spacing:3px; margin-bottom:8px; }
		h1 { font-size:clamp(34px, 6vw, 68px); line-height:.9; margin:0; letter-spacing:-3px; }
		.subtitle { color:var(--muted); max-width:300px; font:12px/1.6 'Courier New', monospace; text-align:right; }
		.scoreboard { display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center; background:rgba(23,32,31,.85); border:1px solid var(--line); padding:13px 18px; }
		.score { display:flex; align-items:center; gap:12px; font:700 12px 'Courier New', monospace; letter-spacing:1px; }
		.score.right { justify-content:flex-end; }
		.dot { width:10px; height:10px; border-radius:50%; display:inline-block; box-shadow:0 0 14px currentColor; }
		.p1 { color:var(--orange); } .p2 { color:var(--cyan); }
		.health { height:7px; flex:1; max-width:220px; background:#29302f; overflow:hidden; }
		.health i { display:block; height:100%; width:100%; background:currentColor; transition:width .15s ease; }
		.versus { color:#6e7a77; font:700 11px 'Courier New', monospace; }
		#game-shell { position:relative; margin-top:14px; border:1px solid var(--line); background:#111918; box-shadow:0 22px 60px rgba(0,0,0,.3); }
		canvas { display:block; width:100%; height:auto; aspect-ratio:1100/620; }
		#overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(9,14,13,.72); opacity:0; pointer-events:none; transition:opacity .2s; }
		#overlay.show { opacity:1; pointer-events:auto; }
		#select-screen { position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; background:rgba(5,10,11,.94); padding:20px; }
		#select-screen.hidden { display:none; }
		.select-box { width:min(900px,100%); text-align:center; }
		.select-box h2 { margin:0 0 6px; font-size:clamp(25px,4vw,42px); color:#effffc; text-shadow:0 0 18px #55d6ce; }
		.select-box > p { color:var(--muted); margin:0 0 20px; font:11px 'Courier New',monospace; }
		.pickers { display:block; }
		.picker { border:1px solid var(--line); padding:14px; background:#121b1b; }
		.picker h3 { margin:0 0 12px; font:700 12px 'Courier New',monospace; letter-spacing:2px; }
		.ability-list { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:7px; }
		.ability { position:relative; border:1px solid #344541; background:#1b2826; color:var(--ink); text-align:left; padding:10px; cursor:pointer; min-height:112px; }
		.ability:hover,.ability.selected-p1,.ability.selected-p2 { background:#243532; }
		.ability.selected-p1 { border-color:var(--orange); box-shadow:inset 0 0 0 2px #ff734d66; }
		.ability.selected-p2 { border-color:var(--cyan); box-shadow:inset 0 0 0 2px #55d6ce66; }
		.ability.selected-p1.selected-p2 { box-shadow:inset 0 0 0 2px #ff734d, inset 0 0 0 5px #55d6ce; }
		.ability strong { display:block; font:700 12px Georgia,serif; margin:7px 0 4px; }
		.ability span { display:block; color:var(--muted); font:10px/1.4 'Courier New',monospace; }
		.ability-icon { display:block; height:35px; color:#effffc; font:28px/35px Georgia,serif; text-shadow:0 0 12px currentColor; }
		.selection-tag { display:none; position:absolute; top:8px; right:8px; font:700 9px 'Courier New',monospace; letter-spacing:1px; }
		.selection-tag.p1 { left:8px; right:auto; color:var(--orange); } .selection-tag.p2 { color:var(--cyan); }
		#start-game { display:none; margin-top:18px; min-width:160px; background:var(--cyan); color:#071313; box-shadow:0 0 18px #55d6ce66; }
		.ult { color:#f5fffd; font:10px 'Courier New',monospace; margin-left:8px; }
		@media (max-width:640px) { .picker { overflow-x:auto; } .ability-list { min-width:620px; } .ability { min-height:98px; } }
		.result { text-align:center; background:#17211f; border:1px solid #52625d; padding:28px 42px; box-shadow:0 15px 40px #0008; }
		.result small { color:var(--orange); font:11px 'Courier New', monospace; letter-spacing:2px; }
		.result h2 { font-size:38px; margin:8px 0 18px; }
		button { cursor:pointer; border:0; padding:11px 18px; background:var(--orange); color:#17100d; font:700 12px 'Courier New', monospace; }
		.instructions { display:grid; grid-template-columns:1fr 1fr; gap:1px; margin-top:14px; background:var(--line); border:1px solid var(--line); }
		.instructions section { background:var(--panel); padding:17px 20px; display:flex; justify-content:space-between; align-items:center; }
		.instructions section:last-child { text-align:right; flex-direction:row-reverse; }
		.instructions b { font-size:22px; } .instructions p { margin:0; color:var(--muted); font:11px/1.6 'Courier New', monospace; }
		kbd { border:1px solid #52605d; padding:3px 5px; color:var(--ink); font:11px 'Courier New', monospace; background:#202b29; }
		@media (max-width:640px) { body { padding:10px 6px 18px; } .game-brand { top:14px; left:16px; } .game-brand .subtitle { display:none; } .game-brand h1 { font-size:34px; } .scoreboard { padding:11px 9px; gap:7px; } .score { font-size:10px; gap:6px; } .health { max-width:85px; } .instructions section { padding:12px 10px; } .instructions p { font-size:9px; } }
	</style>
</head>
<body>
	<main>
		<div class="scoreboard">
			<div class="score p1"><span class="dot" style="background:currentColor"></span><span>P1</span><div class="health"><i id="health1"></i></div><strong id="value1">100</strong></div>
			<div class="versus">VS</div>
			<div class="score right p2"><strong id="value2">100</strong><div class="health"><i id="health2"></i></div><span>P2</span><span class="dot" style="background:currentColor"></span></div>
		</div>
		<div id="game-shell">
			<canvas id="arena" width="1100" height="620" aria-label="2인용 대전 게임 화면"></canvas>
			<div id="select-screen"><div class="select-box"><h2>CHOOSE YOUR EDGE</h2><p>같은 목록에서 각자 능력을 선택하세요 · P1 필살기 C / P2 필살기 \</p><div class="pickers"><div class="picker"><h3>SHARED LOADOUT · <span class="p1">P1</span> / <span class="p2">P2</span></h3><div class="ability-list"></div></div></div><button id="start-game">ENTER ARENA</button></div></div>
			<div id="overlay"><div class="result"><small>MATCH COMPLETE</small><h2 id="winner">P1 WINS</h2><button id="restart">REMATCH ↵</button></div></div>
		</div>
		<div class="instructions">
			<section><b class="p1">P1</b><p>이동 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd><br>발사 <kbd>SPACE</kbd></p></section>
			<section><b class="p2">P2</b><p>이동 <kbd>L</kbd> <kbd>'</kbd> <kbd>P</kbd> <kbd>;</kbd><br>발사 <kbd>=</kbd> · 필살기 <kbd>\</kbd></p></section>
		</div>
	</main>
	<script>
		const canvas = document.getElementById('arena'), ctx = canvas.getContext('2d');
		const W=canvas.width, H=canvas.height, wall=550, keys=new Set(), bullets=[], trails=[], effects=[], cannons=[];
		const MAX_BULLETS=100, MAX_TRAILS=90, MAX_EFFECTS=100;
		let last=performance.now(), running=false, shake=0, camera={x:W/2,y:H/2,zoom:1};
		const abilities={
			invincible:{name:'무적',color:'#f7e36b',description:'5초 동안 모든 피해를 무시합니다.'},
			awakening:{name:'각성',color:'#ff5ce1',description:'5초 동안 가속, 관통, 총알 피해 10.'},
			cannon:{name:'대포',color:'#ff9f43',description:'위치에 10초 대포를 설치해 자동 발사합니다.'},
			sniper:{name:'명사수',color:'#b78cff',description:'투명화, 확대 조준. 정확히 맞추면 50 피해.'}
		};
		const players={p1:{x:150,y:H/2,color:'#ff734d',baseColor:'#ff734d',hp:100,fire:' ',ult:'c',controls:['a','d','w','s'],dir:1,ability:null},p2:{x:W-150,y:H/2,color:'#55d6ce',baseColor:'#55d6ce',hp:100,fire:'=',ult:'\\',controls:['l',"'",'p',';'],dir:-1,ability:null}};
		const selectionIndex={p1:0,p2:0};
		const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
		function makePickers(){const box=document.querySelector('.ability-list');for(const [key,a] of Object.entries(abilities)){const button=document.createElement('button');button.className='ability';button.dataset.ability=key;button.innerHTML=`<i class="ability-icon">${key==='invincible'?'◇':key==='awakening'?'ϟ':key==='cannon'?'▰':'⊙'}</i><strong>${a.name}</strong><span>${a.description}</span><em class="selection-tag p1">P1</em><em class="selection-tag p2">P2</em>`;box.appendChild(button);}selectAbility('p1',0);selectAbility('p2',0);}
		function selectAbility(id,index){const buttons=document.querySelectorAll('.ability-list .ability');selectionIndex[id]=(index+buttons.length)%buttons.length;buttons.forEach(item=>{item.classList.remove('selected-'+id);item.querySelector('.selection-tag.'+id).style.display='none';});buttons[selectionIndex[id]].classList.add('selected-'+id);buttons[selectionIndex[id]].querySelector('.selection-tag.'+id).style.display='block';players[id].ability=buttons[selectionIndex[id]].dataset.ability;}
		function navigateSelection(id,key){const current=selectionIndex[id];const next=(key==='left'||key==='up'?current-1:current+1);selectAbility(id,next);}
		function confirmSelection(id){players[id].selected=true;if(players.p1.selected&&players.p2.selected)startGame();}
		function reset(){players.p1.x=150;players.p1.y=H/2;players.p1.hp=100;players.p1.lastShot=0;players.p1.ultCooldown=0;players.p1.special=null;players.p1.selected=false;players.p2.x=W-150;players.p2.y=H/2;players.p2.hp=100;players.p2.ultCooldown=0;players.p2.special=null;players.p2.selected=false;bullets.length=0;trails.length=0;effects.length=0;cannons.length=0;running=false;document.getElementById('overlay').classList.remove('show');document.getElementById('select-screen').classList.remove('hidden');updateHealth();}
		function startGame(){if(!players.p1.ability||!players.p2.ability)return;players.p1.color=players.p1.baseColor;players.p2.color=players.p2.baseColor;running=true;document.getElementById('select-screen').classList.add('hidden');}
		document.addEventListener('keydown',e=>{const key=e.key.toLowerCase();keys.add(key);if([' ','arrowup','arrowdown','arrowleft','arrowright','enter','+','=','\\'].includes(key))e.preventDefault();if(!e.repeat&&!running&&players.p1&&players.p2){if(['a','d','w','s'].includes(key))navigateSelection('p1',key==='a'||key==='w'?'left':'right');if(players.p2.controls.includes(key))navigateSelection('p2',key==='l'||key==='p'?'left':'right');if(key===players.p1.fire)confirmSelection('p1');if(key===players.p2.fire)confirmSelection('p2');}else if(!e.repeat&&running){if(key===players.p1.ult)activate(players.p1);else if(key===players.p2.ult)activate(players.p2);else if(key===players.p1.fire)shoot(players.p1,performance.now());else if(key===players.p2.fire)shoot(players.p2,performance.now());}});
		document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
		document.getElementById('restart').addEventListener('click',reset);makePickers();
		function updateHealth(){for(const [id,p] of Object.entries(players)){document.getElementById('health'+id.slice(1)).style.width=p.hp+'%';document.getElementById('value'+id.slice(1)).textContent=p.hp;document.querySelector('.score.'+id+' .dot')?.style.setProperty('background',p.color);}}
		function activate(p){if(p.special||p.ultCooldown>0)return;p.ultCooldown=p.ability==='cannon'?20:10;p.color=abilities[p.ability].color;updateHealth();if(p.ability==='invincible'||p.ability==='awakening'){p.special={type:p.ability,time:5};}else if(p.ability==='cannon'){cannons.push({x:p.x,y:p.y,owner:p,life:10,lastShot:0});p.special={type:'cannon',time:10};}else if(p.ability==='sniper'){p.special={type:'sniper',time:5,alpha:1,zoom:1,cameraX:players[p===players.p1?'p2':'p1'].x,cameraY:players[p===players.p1?'p2':'p1'].y};}effects.push({type:'burst',x:p.x,y:p.y,color:p.color,life:.5,maxLife:.5});}
		function shoot(p,now){if(p.special?.type==='sniper'){const target=p===players.p1?players.p2:players.p1;const aligned=Math.hypot(target.x-p.special.cameraX,target.y-p.special.cameraY)<30;if(aligned){target.hp=Math.max(0,target.hp-50);shake=70;updateHealth();if(target.hp===0)end(p===players.p1?'P1 WINS':'P2 WINS');}p.special=null;p.color=p.baseColor;return;}if(bullets.length>=MAX_BULLETS)return;const piercing=p.special?.type==='awakening';const damage=piercing?10:5;shake=Math.max(shake,28);const x=p.x+p.dir*27;bullets.push({x,y:p.y,dir:p.dir,color:piercing?'rgba(0,0,0,0)':p.color,damage,piercing,size:piercing?24:14,owner:p});if(effects.length<MAX_EFFECTS){effects.push({type:'flash',x,y:p.y,dir:p.dir,color:p.color,life:.12,maxLife:.12});for(let i=0;i<4;i++)effects.push({type:'spark',x,y:p.y,vx:p.dir*(90+Math.random()*180),vy:(Math.random()-.5)*180,life:.3,maxLife:.4,radius:2+Math.random()*3,color:p.color});}}
		function hit(b,p){return Math.abs(b.x-p.x)<24&&Math.abs(b.y-p.y)<25;}
		function update(dt,now){for(const p of Object.values(players)){const oldX=p.x,oldY=p.y,speed=p.special?.type==='awakening'?520:320;const [l,r,u,d]=p.controls;if(p.special?.type==='sniper'){if(keys.has(l))p.special.cameraX-=220*dt;if(keys.has(r))p.special.cameraX+=220*dt;if(keys.has(u))p.special.cameraY-=220*dt;if(keys.has(d))p.special.cameraY+=220*dt;p.special.cameraX=clamp(p.special.cameraX,40,W-40);p.special.cameraY=clamp(p.special.cameraY,40,H-40);p.special.alpha=Math.max(0,p.special.alpha-dt*1.5);p.special.zoom=Math.min(1.45,p.special.zoom+dt*5);p.special.time-=dt;if(p.special.time<=0){p.special=null;p.color=p.baseColor;}}else{if(keys.has(l))p.x-=speed*dt;if(keys.has(r))p.x+=speed*dt;if(keys.has(u))p.y-=speed*dt;if(keys.has(d))p.y+=speed*dt;const minX=p.special?.type==='invincible'?35:(p===players.p1?35:wall+35);const maxX=p.special?.type==='invincible'?W-35:(p===players.p1?wall-35:W-35);p.x=clamp(p.x,minX,maxX);p.y=clamp(p.y,35,H-35);if(Math.abs(p.x-oldX)+Math.abs(p.y-oldY)>.1)trails.push({x:oldX,y:oldY,color:p.color,life:.28,maxLife:.28});}if(p.special&&p.special.type!=='sniper'){p.special.time-=dt;if(p.special.time<=0){if(p.special.type==='invincible')p.x=clamp(p.x,p===players.p1?35:wall+35,p===players.p1?wall-35:W-35);p.special=null;p.color=p.baseColor;}}}
			for(const p of Object.values(players)){if(p.ultCooldown>0)p.ultCooldown=Math.max(0,p.ultCooldown-dt);if(p.special?.type==='sniper'){const [l,r,u,d]=p.controls;if(keys.has(l))p.special.cameraX-=80*dt;if(keys.has(r))p.special.cameraX+=80*dt;if(keys.has(u))p.special.cameraY-=80*dt;if(keys.has(d))p.special.cameraY+=80*dt;p.special.cameraX=clamp(p.special.cameraX,40,W-40);p.special.cameraY=clamp(p.special.cameraY,40,H-40);}}
			for(let i=cannons.length-1;i>=0;i--){const cannon=cannons[i];cannon.life-=dt;if(cannon.life<=0){cannons.splice(i,1);continue;}cannon.lastShot-=dt;if(cannon.lastShot<=0){const target=cannon.owner===players.p1?players.p2:players.p1;const flight=.4,fuse=.5;bullets.push({x:cannon.x,y:cannon.y,landX:target.x,landY:target.y,vx:(target.x-cannon.x)/flight,vy:(target.y-cannon.y)/flight,age:0,flight,fuse,z:0,phase:'flying',dir:0,color:'#ff9f43',damage:5,cannon:true,bomb:true,owner:cannon.owner});cannon.lastShot=1;}}
			for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];if(b.bomb){if(b.phase==='flying'){b.age+=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z=Math.sin(Math.min(b.age/b.flight,1)*Math.PI)*130;if(b.age>=b.flight){b.x=b.landX;b.y=b.landY;b.z=0;b.phase='landed';b.age=0;}}else{b.age+=dt;if(b.age>=b.fuse){const target=b.owner===players.p1?players.p2:players.p1;const inBlast=Math.hypot(b.x-target.x,b.y-target.y)<90;const protectedTarget=target.special&&['invincible','sniper'].includes(target.special.type);if(inBlast&&!protectedTarget){target.hp=Math.max(0,target.hp-b.damage*3);updateHealth();if(target.hp===0)end(b.owner===players.p1?'P1 WINS':'P2 WINS');}effects.push({type:'explosion',x:b.x,y:b.y,color:'#ff9f43',life:.35,maxLife:.35,radius:90});shake=Math.max(shake,18);bullets.splice(i,1);}}continue;}b.x+=(b.vx??b.dir*960)*dt;b.y+=(b.vy??0)*dt;let blocked=false;for(let j=i-1;j>=0;j--){const o=bullets[j];if(!b.cannon&&!o.cannon&&b.dir!==o.dir&&Math.abs(b.x-o.x)<28&&Math.abs(b.y-o.y)<8){if(b.piercing){bullets.splice(j,1);continue;}if(o.piercing){bullets.splice(i,1);blocked=true;break;}bullets.splice(i,1);bullets.splice(j,1);blocked=true;break;}}if(blocked){i=bullets.length;continue;}const target=b.owner===players.p1?players.p2:players.p1;if(hit(b,target)){if(!target.special||!['invincible','sniper'].includes(target.special.type)){target.hp=Math.max(0,target.hp-b.damage);updateHealth();if(target.hp===0)end(b.owner===players.p1?'P1 WINS':'P2 WINS');}if(!b.piercing)bullets.splice(i,1);}else if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30)bullets.splice(i,1);}
			for(let i=trails.length-1;i>=0;i--){trails[i].life-=dt;if(trails[i].life<=0)trails.splice(i,1);}if(trails.length>MAX_TRAILS)trails.splice(0,trails.length-MAX_TRAILS);for(let i=effects.length-1;i>=0;i--){const effect=effects[i];effect.life-=dt;if(effect.vx){effect.x+=effect.vx*dt;effect.y+=effect.vy*dt;effect.vx*=.94;effect.vy*=.94;}if(effect.life<=0)effects.splice(i,1);}}
		function end(text){running=false;document.getElementById('winner').textContent=text;document.getElementById('overlay').classList.add('show');}
		function draw(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.8;}ctx.fillStyle='#111918';ctx.fillRect(0,0,W,H);const sniper=players.p1.special?.type==='sniper'?players.p1:players.p2.special?.type==='sniper'?players.p2:null;if(sniper){camera.x=sniper.special.cameraX;camera.y=sniper.special.cameraY;camera.zoom=sniper.special.zoom;}else{camera.x=W/2;camera.y=H/2;camera.zoom=1;}ctx.translate(W/2,H/2);ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);ctx.strokeStyle='#1d2a28';ctx.lineWidth=1;for(let x=0;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.fillStyle='#273633';ctx.fillRect(wall-6,0,12,H);ctx.fillStyle='#435650';ctx.fillRect(wall-2,0,4,H);for(let y=18;y<H;y+=42){ctx.fillStyle='#9aafaa';ctx.fillRect(wall-1,y,2,12);}for(const trail of trails){ctx.globalAlpha=trail.life/trail.maxLife*.28;ctx.fillStyle=trail.color;ctx.beginPath();ctx.arc(trail.x,trail.y,22,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}for(const cannon of cannons){ctx.fillStyle='#ff9f43';ctx.shadowColor='#ff9f43';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(cannon.x,cannon.y,18,0,Math.PI*2);ctx.fill();ctx.fillRect(cannon.x-7,cannon.y-28,14,35);ctx.shadowBlur=0;}for(const effect of effects){const opacity=effect.life/effect.maxLife;ctx.globalAlpha=opacity;ctx.fillStyle=effect.color;ctx.shadowColor=effect.color;ctx.shadowBlur=effect.type==='flash'?10:4;if(effect.type==='flash'||effect.type==='burst'){ctx.beginPath();ctx.arc(effect.x,effect.y,18+opacity*18,0,Math.PI*2);ctx.fill();}else if(effect.type==='explosion'){ctx.lineWidth=6;ctx.beginPath();ctx.arc(effect.x,effect.y,effect.radius*(1-opacity*.35),0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(effect.x,effect.y,24*opacity,0,Math.PI*2);ctx.fill();}else{ctx.beginPath();ctx.arc(effect.x,effect.y,effect.radius*opacity,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;ctx.globalAlpha=1;}for(const b of bullets){ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=6;if(b.bomb){const height=b.z||0;ctx.globalAlpha=.25;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(b.x,b.y+4,12+height*.03,4,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#ffcf5c';ctx.beginPath();ctx.arc(b.x,b.y-height,10+height*.025,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff2a1';ctx.beginPath();ctx.arc(b.x-3,b.y-height-3,3,0,Math.PI*2);ctx.fill();}else if(b.cannon){ctx.beginPath();ctx.arc(b.x,b.y,7,0,Math.PI*2);ctx.fill();}else ctx.fillRect(b.x-14,b.y-3,28,6);ctx.shadowBlur=0;}for(const p of Object.values(players)){if(p.special?.type==='sniper'&&p.special.alpha<=.05)continue;ctx.save();ctx.globalAlpha=p.special?.type==='sniper'?p.special.alpha:1;ctx.translate(p.x,p.y);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#101615';ctx.beginPath();ctx.arc(p.dir*7,-6,4,0,Math.PI*2);ctx.fill();ctx.fillRect(p.dir*14-(p.dir>0?0:28),-4,28,8);ctx.restore();}ctx.fillStyle='#667873';ctx.font='11px Courier New';ctx.textAlign='center';ctx.fillText('NO CROSSING',wall,H-18);ctx.restore();if(sniper){ctx.save();ctx.strokeStyle=abilities.sniper.color;ctx.shadowColor=abilities.sniper.color;ctx.shadowBlur=6;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2-35,H/2);ctx.lineTo(W/2+35,H/2);ctx.moveTo(W/2,H/2-35);ctx.lineTo(W/2,H/2+35);ctx.stroke();ctx.restore();}}
		function drawAwakeningRounds(){for(const b of bullets){if(!b.piercing)continue;ctx.save();ctx.fillStyle='#ff5ce1';ctx.shadowColor='#ff5ce1';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(b.x,b.y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff0ff';ctx.shadowBlur=0;ctx.beginPath();ctx.arc(b.x-3,b.y-3,3,0,Math.PI*2);ctx.fill();ctx.restore();}}
		function drawWatermark(){ctx.save();ctx.globalAlpha=.1;ctx.fillStyle='#55d6ce';ctx.font='700 100px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('DUEL ARENA',W/2,H/2);ctx.restore();}
		function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;if(running)update(dt,now);draw();drawWatermark();drawAwakeningRounds();requestAnimationFrame(loop);}updateHealth();requestAnimationFrame(loop);
	</script>
