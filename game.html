<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUEL / 2P Arena</title>
    <style>
        :root { --ink:#f2f4f1; --muted:#98a29f; --line:#2d3937; --bg:#101615; --panel:#17201f; --orange:#ff734d; --cyan:#55d6ce; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% -10%, #263b37 0, var(--bg) 46%); color:var(--ink); font-family:Georgia, 'Times New Roman', serif; display:flex; justify-content:center; padding:28px 18px 36px; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
        main { width:min(1400px, 100%); }
        header { display:flex; justify-content:space-between; align-items:end; gap:20px; }
        .game-brand { display:none; }
        .eyebrow { color:var(--orange); font:700 11px/1.2 'Courier New', monospace; letter-spacing:3px; margin-bottom:8px; }
        h1 { font-size:clamp(34px, 6vw, 68px); line-height:.9; margin:0; letter-spacing:-3px; }
        .subtitle { color:var(--muted); max-width:300px; font:14px/1.6 Georgia, 'Malgun Gothic', sans-serif; font-weight:700; text-align:right; }
        .scoreboard { display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center; background:rgba(23,32,31,.85); border:1px solid var(--line); padding:13px 18px; }
        .score { display:flex; align-items:center; gap:12px; font:700 12px 'Courier New', monospace; letter-spacing:1px; }
        .score.right { justify-content:flex-end; }
        .dot { width:10px; height:10px; border-radius:50%; display:inline-block; box-shadow:0 0 14px currentColor; }
        .p1 { color:var(--orange); } .p2 { color:var(--cyan); }
        .health { height:7px; flex:1; max-width:220px; background:#29302f; overflow:hidden; }
        .health i { display:block; height:100%; width:100%; background:currentColor; transition:width .15s ease; }
        .ultimate-status { color:var(--muted); font:700 10px 'Courier New',monospace; white-space:nowrap; }
        .ultimate-status.ready { color:#f7e36b; text-shadow:0 0 10px currentColor; }
        .versus { color:#6e7a77; font:700 11px 'Courier New', monospace; }
        #game-shell { position:relative; margin-top:14px; border:1px solid var(--line); background:#111918; box-shadow:0 22px 60px rgba(0,0,0,.3); }
        canvas { display:block; width:100%; height:auto; aspect-ratio:1100/620; }
        #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(9,14,13,.72); opacity:0; pointer-events:none; transition:opacity .2s; }
        #overlay.show { opacity:1; pointer-events:auto; }
        #select-screen { position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; background:rgba(5,10,11,.94); padding:20px; }
        #select-screen.hidden { display:none; }
        .select-box { width:min(900px,100%); text-align:center; }
        .select-box h2 { margin:0 0 6px; font-size:clamp(25px,4vw,42px); color:#effffc; text-shadow:0 0 18px #55d6ce; }
        .select-box > p { color:var(--muted); margin:0 0 20px; font:13px/1.5 Georgia, 'Malgun Gothic', sans-serif; font-weight:700; }
        .pickers { display:block; }
        .picker { border:1px solid var(--line); padding:14px; background:#121b1b; }
        .picker h3 { margin:0 0 12px; font:700 12px 'Courier New',monospace; letter-spacing:2px; }
        .ability-list { display:grid; grid-template-columns:repeat(5,minmax(150px,1fr)); gap:7px; }
        .ability { position:relative; border:1px solid #344541; background:#1b2826; color:var(--ink); text-align:left; padding:10px; cursor:pointer; min-height:112px; }
        .ability:hover,.ability.focused-p1,.ability.focused-p2 { background:#243532; }
        .ability.focused-p1 { border-color:var(--orange); box-shadow:inset 0 0 0 1px #ff734d66; }
        .ability.focused-p2 { border-color:var(--cyan); box-shadow:inset 0 0 0 1px #55d6ce66; }
        .ability.selected-p1 { border-color:var(--orange); background:rgba(255,115,77,.28); box-shadow:inset 0 0 0 2px #ff734d66; opacity:1; }
        .ability.selected-p2 { border-color:var(--cyan); background:rgba(85,214,206,.28); box-shadow:inset 0 0 0 2px #55d6ce66; opacity:1; }
        .ability.selected-p1.selected-p2 { background:rgba(85,214,206,.28); box-shadow:inset 0 0 0 2px #ff734d, inset 0 0 0 5px #55d6ce; opacity:1; }
        .ability strong { display:block; font:700 12px Georgia,serif; margin:7px 0 4px; }
        .ability span { display:block; color:var(--muted); font:12px/1.45 Georgia, 'Malgun Gothic', sans-serif; font-weight:700; }
        .ability-icon { display:block; height:35px; color:#effffc; font:28px/35px Georgia,serif; text-shadow:0 0 12px currentColor; }
        .selection-tag { display:none; position:absolute; top:8px; right:8px; font:700 9px 'Courier New',monospace; letter-spacing:1px; }
        .selection-tag.p1 { left:8px; right:auto; color:var(--orange); } .selection-tag.p2 { color:var(--cyan); }
        .selection-status { display:flex; justify-content:center; gap:28px; margin-top:12px; font:700 12px/1.5 'Courier New',monospace; }
        .selection-status span { color:var(--muted); }
        .selection-status .ready { color:#f4f6f2; }
        #start-game { display:none; margin-top:18px; min-width:160px; background:var(--cyan); color:#071313; box-shadow:0 0 18px #55d6ce66; }
        .ult { color:#f5fffd; font:10px 'Courier New',monospace; margin-left:8px; }
        @media (max-width:640px) { .picker { overflow-x:auto; } .ability-list { min-width:780px; } .ability { min-height:98px; } .ability span { font-size:11px; } }
        .result { text-align:center; background:#17211f; border:1px solid #52625d; padding:28px 42px; box-shadow:0 15px 40px #0008; }
        .result small { color:var(--orange); font:11px 'Courier New', monospace; letter-spacing:2px; }
        .result h2 { font-size:38px; margin:8px 0 18px; }
        button { cursor:pointer; border:0; padding:11px 18px; background:var(--orange); color:#17100d; font:700 12px 'Courier New', monospace; }
        .instructions { display:grid; grid-template-columns:1fr 1fr; gap:1px; margin-top:14px; background:var(--line); border:1px solid var(--line); }
        .instructions section { background:var(--panel); padding:17px 20px; display:flex; justify-content:space-between; align-items:center; }
        .instructions section:last-child { text-align:right; flex-direction:row-reverse; }
        .instructions b { font-size:22px; } .instructions p { margin:0; color:var(--muted); font:13px/1.6 Georgia, 'Malgun Gothic', sans-serif; font-weight:700; }
        kbd { border:1px solid #52605d; padding:3px 5px; color:var(--ink); font:11px 'Courier New', monospace; background:#202b29; }
        @media (max-width:640px) { body { padding:10px 6px 18px; } .game-brand { top:14px; left:16px; } .game-brand .subtitle { display:none; } .game-brand h1 { font-size:34px; } .scoreboard { padding:11px 9px; gap:7px; } .score { font-size:10px; gap:6px; } .health { max-width:85px; } .instructions section { padding:12px 10px; } .instructions p { font-size:11px; } }
    </style>
</head>
<body>
    <main>
        <div class="scoreboard">
            <div class="score p1"><span class="dot" style="background:currentColor"></span><span>P1</span><div class="health"><i id="health1"></i></div><strong id="value1">100</strong><span id="ult-status1" class="ultimate-status">ULT READY</span></div>
            <div class="versus">VS</div>
            <div class="score right p2"><span id="ult-status2" class="ultimate-status">ULT READY</span><strong id="value2">100</strong><div class="health"><i id="health2"></i></div><span>P2</span><span class="dot" style="background:currentColor"></span></div>
        </div>
        <div id="game-shell">
            <canvas id="arena" width="1100" height="620" aria-label="2인용 대전 게임 화면"></canvas>
            <div id="select-screen"><div class="select-box"><h2>CHOOSE YOUR EDGE</h2><p>같은 목록에서 각자 능력을 선택하세요 · P1 선택 C / P2 선택 \</p><div class="pickers"><div class="picker"><h3>SHARED LOADOUT · <span class="p1">P1</span> / <span class="p2">P2</span></h3><div class="ability-list"></div></div></div><div class="selection-status"><span id="select-status-p1">P1 선택 중</span><span id="select-status-p2">P2 선택 중</span></div><button id="start-game">ENTER ARENA</button></div></div>
            <div id="overlay"><div class="result"><small>MATCH COMPLETE</small><h2 id="winner">P1 WINS</h2><button id="restart">REMATCH ↵</button></div></div>
        </div>
        <div class="instructions">
            <section><b class="p1">P1</b><p>이동 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd><br>공격 <kbd>C</kbd> · 필살기 <kbd>V</kbd></p></section>
            <section><b class="p2">P2</b><p>이동 <kbd>L</kbd> <kbd>'</kbd> <kbd>P</kbd> <kbd>;</kbd><br>발사 <kbd>\</kbd> · 필살기 <kbd>Enter</kbd></p></section>
        </div>
    </main>
    <script>
        const canvas = document.getElementById('arena'), ctx = canvas.getContext('2d');
        const W=canvas.width, H=canvas.height, wall=550, keys=new Set(), bullets=[], trails=[], effects=[], cannons=[];
        const MAX_BULLETS=100, MAX_TRAILS=90, MAX_EFFECTS=100;
        let last=performance.now(), running=false, shake=0, camera={x:W/2,y:H/2,zoom:1};
        
        const abilities={
            melee:{name:'근접',color:'#f7e36b',description:'5초 동안 근접 공격 능력을 얻습니다.'},
            transcendence:{name:'초월',color:'#ff5ce1',description:'5초 동안 가속, 관통, 총알 피해 20.'},
            cannon:{name:'포격',color:'#ff9f43',description:'위치에 포격을 설치해 자동 발사합니다. (영구 지속)'},
            sniper:{name:'명사수',color:'#b78cff',description:'투명화, 확대 조준. 정확히 맞추면 50 피해.'},
            dash:{name:'돌진',color:'#58a6ff',description:'시전 후 각도 조절, 돌진 중 무적 및 데미지 20 (쿨타임 20초)'}
        };

        const players={
            p1:{x:150,y:H/2,vx:0,vy:0,color:'#ff734d',baseColor:'#ff734d',hp:100,fire:'KeyC',ult:'KeyV',controls:['KeyA','KeyD','KeyW','KeyS'],dir:1,ability:null},
            p2:{x:W-150,y:H/2,vx:0,vy:0,color:'#55d6ce',baseColor:'#55d6ce',hp:100,fire:'Backslash',ult:'Enter',controls:['KeyL',"Quote","KeyP","Semicolon"],dir:-1,ability:null}
        };
        const selectionIndex={p1:0,p2:0};
        const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
        
        function makePickers(){
            const box=document.querySelector('.ability-list');
            for(const [key,a] of Object.entries(abilities)){
                const button=document.createElement('button');
                button.className='ability';
                button.dataset.ability=key;
                button.innerHTML=`<i class="ability-icon">${key==='melee'?'◇':key==='transcendence'?'ϟ':key==='cannon'?'▰':key==='sniper'?'⊙':'➜'}</i><strong>${a.name}</strong><span>${a.description}</span><em class="selection-tag p1">P1</em><em class="selection-tag p2">P2</em>`;
                box.appendChild(button);
            }
            selectAbility('p1',0);selectAbility('p2',0);
        }
        function selectAbility(id,index){const buttons=document.querySelectorAll('.ability-list .ability');selectionIndex[id]=(index+buttons.length)%buttons.length;buttons.forEach(item=>item.classList.remove('focused-'+id));buttons[selectionIndex[id]].classList.add('focused-'+id);players[id].ability=buttons[selectionIndex[id]].dataset.ability;}
        function navigateSelection(id,key){const current=selectionIndex[id];const next=(key==='left'||key==='up'?current-1:current+1);selectAbility(id,next);}
        function confirmSelection(id){const buttons=document.querySelectorAll('.ability-list .ability');const card=buttons[selectionIndex[id]];players[id].selected=!players[id].selected;card.classList.toggle('selected-'+id,players[id].selected);card.querySelector('.selection-tag.'+id).style.display=players[id].selected?'block':'none';const status=document.getElementById('select-status-'+id);status.textContent=players[id].selected?id.toUpperCase()+' 확정':id.toUpperCase()+' 선택 중';status.classList.toggle('ready',players[id].selected);if(players.p1.selected&&players.p2.selected)startGame();}
        function reset(){players.p1.x=150;players.p1.y=H/2;players.p1.vx=0;players.p1.vy=0;players.p1.hp=100;players.p1.lastShot=0;players.p1.ultCooldown=0;players.p1.special=null;players.p1.selected=false;players.p2.x=W-150;players.p2.y=H/2;players.p2.vx=0;players.p2.vy=0;players.p2.hp=100;players.p2.ultCooldown=0;players.p2.special=null;players.p2.selected=false;bullets.length=0;trails.length=0;effects.length=0;cannons.length=0;running=false;document.getElementById('overlay').classList.remove('show');document.getElementById('select-screen').classList.remove('hidden');updateHealth();}
        function startGame(){if(!players.p1.ability||!players.p2.ability)return;players.p1.color=players.p1.baseColor;players.p2.color=players.p2.baseColor;running=true;document.getElementById('select-screen').classList.add('hidden');}
        
        window.addEventListener('keydown', e => {
            const code = e.code;
            keys.add(code);
            if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','NumpadAdd','Equal','Backslash'].includes(code)) e.preventDefault();
            
            if(!running && players.p1 && players.p2){
                if(!e.repeat){
                    if(!players.p1.selected && ['KeyA','KeyD','KeyW','KeyS'].includes(code)) navigateSelection('p1', code==='KeyA'||code==='KeyW'?'left':'right');
                    if(!players.p2.selected && players.p2.controls.includes(code)) navigateSelection('p2', code==='KeyL'||code==='KeyP'?'left':'right');
                    if(code === players.p1.fire) confirmSelection('p1');
                    if(code === players.p2.fire) confirmSelection('p2');
                }
            } else if(running){
                if(!e.repeat){
                    if(code === players.p1.ult) activate(players.p1);
                    else if(code === players.p2.ult) activate(players.p2);
                    else if(code === players.p1.fire) shoot(players.p1, performance.now());
                    else if(code === players.p2.fire) shoot(players.p2, performance.now());
                }
            }
        });
        
        window.addEventListener('keyup', e => {
            keys.delete(e.code);
        });
        
        window.addEventListener('blur', () => keys.clear());

        document.getElementById('restart').addEventListener('click',()=>{reset();document.querySelectorAll('.ability').forEach(item=>{item.classList.remove('selected-p1','selected-p2');item.querySelectorAll('.selection-tag').forEach(tag=>tag.style.display='none');});document.getElementById('select-status-p1').textContent='P1 선택 중';document.getElementById('select-status-p2').textContent='P2 선택 중';document.querySelectorAll('.selection-status span').forEach(item=>item.classList.remove('ready'));});makePickers();
        function updateHealth(){for(const [id,p] of Object.entries(players)){document.getElementById('health'+id.slice(1)).style.width=p.hp+'%';document.getElementById('value'+id.slice(1)).textContent=p.hp;document.querySelector('.score.'+id+' .dot')?.style.setProperty('background',p.color);}}
        function updateUltimateStatus(){for(const [id,p] of Object.entries(players)){const status=document.getElementById('ult-status'+id.slice(1));const ready=p.ultCooldown<=0;status.textContent=ready?'ULT READY':'ULT '+Math.ceil(p.ultCooldown)+'s';status.classList.toggle('ready',ready);}}
        
        function activate(p){
            if(p.special||p.ultCooldown>0)return;
            p.ultCooldown=p.ability==='sniper'?15:(p.ability==='cannon'?20:(p.ability==='dash'?20:10));
            p.color=abilities[p.ability].color;
            updateHealth();
            
            shake=Math.max(shake, 35);
            effects.push({type:'explosion', x:p.x, y:p.y, color:p.color, life:.6, maxLife:.6, radius:110});
            for(let i=0; i<16; i++) {
                effects.push({type:'spark', x:p.x, y:p.y, vx:(Math.random()-.5)*400, vy:(Math.random()-.5)*400, life:.5, maxLife:.5, radius:3+Math.random()*4, color:p.color});
            }

            if(p.ability==='melee'||p.ability==='transcendence'){
                p.special={type:p.ability,time:5};
            }else if(p.ability==='cannon'){
                cannons.push({x:p.x,y:p.y,owner:p,hp:50,lastShot:0});
                shake=Math.max(shake, 50);
                effects.push({type:'explosion', x:p.x, y:p.y, color:'#ff9f43', life:.5, maxLife:.5, radius:130});
                for(let i=0; i<12; i++) {
                    effects.push({type:'spark', x:p.x, y:p.y, vx:(Math.random()-.5)*450, vy:(Math.random()-.5)*450, life:.4, maxLife:.4, radius:4, color:'#ff9f43'});
                }
            }else if(p.ability==='sniper'){
                p.special={type:'sniper',time:5,readyDelay:0.5,alpha:1,zoom:1,cameraX:players[p===players.p1?'p2':'p1'].x,cameraY:players[p===players.p1?'p2':'p1'].y};
            }else if(p.ability==='dash'){
                const startSide = (p === players.p1) ? 'left' : 'right';
                p.special={type:'dash',phase:'aim',time:5,elapsed:0,angle:p.dir>0?0:Math.PI,x:p.x,y:p.y,vx:0,vy:0,hitCooldown:0, startSide: startSide, hasCrossedCenter: false};
            }
            effects.push({type:'burst',x:p.x,y:p.y,color:p.color,life:.5,maxLife:.5});
        }

        function shoot(p,now){
            if(p.special?.type==='sniper'){
                if(p.special.readyDelay > 0) return; // 0.5초 딜레이 체크
                const target=p===players.p1?players.p2:players.p1;
                const aligned=Math.hypot(target.x-p.special.cameraX,target.y-p.special.cameraY)<50;
                
                if(aligned){
                    target.hp=Math.max(0,target.hp-50);
                    shake=110;
                    updateHealth();
                    
                    effects.push({type:'explosion', x:target.x, y:target.y, color:'#b78cff', life:.6, maxLife:.6, radius:160});
                    effects.push({type:'explosion', x:target.x, y:target.y, color:'#ffffff', life:.3, maxLife:.3, radius:80});
                    for(let i=0; i<25; i++) {
                        effects.push({type:'spark', x:target.x, y:target.y, vx:(Math.random()-.5)*650, vy:(Math.random()-.5)*650, life:.6, maxLife:.6, radius:3+Math.random()*5, color:'#b78cff'});
                    }
                    if(target.hp===0)end(p===players.p1?'P1 WINS':'P2 WINS');
                } else {
                    shake=35;
                    effects.push({type:'explosion', x:p.special.cameraX, y:p.special.cameraY, color:'#b78cff', life:.25, maxLife:.25, radius:40});
                }
                p.special=null;p.color=p.baseColor;return;
            }
            if(bullets.length>=MAX_BULLETS)return;
            const piercing=p.special?.type==='transcendence';
            const damage=piercing?20:5; // 초월탄 데미지 20
            shake=Math.max(shake, piercing ? 45 : 28);
            const x=p.x+p.dir*27;
            
            bullets.push({x,y:p.y,dir:p.dir,color:piercing?'rgba(0,0,0,0)':p.color,damage,piercing,size:piercing?24:14,owner:p});
            if(effects.length<MAX_EFFECTS){
                effects.push({type:'flash',x,y:p.y,dir:p.dir,color:p.color,life:.15,maxLife:.15});
                for(let i=0;i<(piercing?8:4);i++) effects.push({type:'spark',x,y:p.y,vx:p.dir*(120+Math.random()*200),vy:(Math.random()-.5)*200,life:.35,maxLife:.35,radius:2+Math.random()*4,color:p.color});
            }
        }

        function hit(b,p){
            if(p.special?.type==='dash' && p.special.phase==='charging'){
                b.x=b.dir===1?W+100:-100;
                return false;
            }
            if(p.special?.type==='melee'&&Math.abs(b.x-p.x)<24&&Math.abs(b.y-p.y)<25){
                b.x=b.dir===1?W+100:-100;
                return false;
            }
            return Math.abs(b.x-p.x)<24&&Math.abs(b.y-p.y)<25;
        }

        function meleeAttack(p){
            const target=p===players.p1?players.p2:players.p1;
            const radius=85;
            
            shake=Math.max(shake, 45);
            effects.push({type:'melee',x:p.x,y:p.y,color:p.color,life:.35,maxLife:.35,radius});
            effects.push({type:'explosion',x:p.x,y:p.y,color:'#f7e36b',life:.3,maxLife:.3,radius:90});
            for(let i=0; i<14; i++) {
                effects.push({type:'spark', x:p.x, y:p.y, vx:(Math.random()-.5)*400, vy:(Math.random()-.5)*400, life:.35, maxLife:.35, radius:3+Math.random()*3, color:'#f7e36b'});
            }
            
            for(let i=cannons.length-1; i>=0; i--){
                if(Math.hypot(p.x-cannons[i].x, p.y-cannons[i].y)<=radius+18){
                    cannons[i].hp -= 50;
                }
            }

            if(Math.hypot(p.x-target.x,p.y-target.y)<=radius&&(!target.special||!['melee','sniper'].includes(target.special.type))){
                target.hp=Math.max(0,target.hp-5);
                updateHealth();
                shake=70;
                effects.push({type:'explosion', x:target.x, y:target.y, color:'#f7e36b', life:.35, maxLife:.35, radius:75});
                if(target.hp===0)end(p===players.p1?'P1 WINS':'P2 WINS');
            }
        }

        const rangedShoot=shoot;
        shoot=(p,now)=>{
            if(p.special?.type==='melee'){meleeAttack(p);return;}
            if(p.special?.type==='sniper'){rangedShoot(p,now);return;}
            
            let shotHandled = false;
            for(let i=cannons.length-1; i>=0; i--){
                if(Math.abs(p.x + p.dir*25 - cannons[i].x) < 30 && Math.abs(p.y - cannons[i].y) < 30){
                    cannons[i].hp -= 50;
                    shotHandled = true;
                    shake = Math.max(shake, 20);
                    break;
                }
            }
            if(shotHandled) return;

            if(p.special?.type==='dash'&&p.special.phase==='aim'){
                p.special.phase='charging';
                p.special.elapsed=0;
                p.special.x=p.x;
                p.special.y=p.y;
                const ultraSpeed = 1950; 
                p.special.vx = Math.cos(p.special.angle) * ultraSpeed;
                p.special.vy = Math.sin(p.special.angle) * ultraSpeed;
                return;
            }
            rangedShoot(p,now);
        };

        function update(dt,now){
            for(const p of Object.values(players)){
                const oldX=p.x,oldY=p.y,maxSpeed=p.special?.type==='transcendence'?520:320;
                const [l,r,u,d]=p.controls;
                
                if(p.special?.type==='transcendence' && Math.random()<0.4){
                    effects.push({type:'spark', x:p.x + (Math.random()-.5)*30, y:p.y + (Math.random()-.5)*30, vx:(Math.random()-.5)*100, vy:(Math.random()-.5)*100, life:.3, maxLife:.3, radius:3, color:'#ff5ce1'});
                }

                if(p.special?.type==='sniper'){
                    if (p.special.readyDelay > 0) {
                        p.special.readyDelay -= dt;
                    }
                    if(keys.has(l))p.special.cameraX-=220*dt;
                    if(keys.has(r))p.special.cameraX+=220*dt;
                    if(keys.has(u))p.special.cameraY-=220*dt;
                    if(keys.has(d))p.special.cameraY+=220*dt;
                    p.special.cameraX=clamp(p.special.cameraX,40,W-40);
                    p.special.cameraY=clamp(p.special.cameraY,40,H-40);
                    p.special.alpha=Math.max(0,p.special.alpha-dt*1.5);
                    p.special.zoom=Math.min(1.45,p.special.zoom+dt*5);
                    p.special.time-=dt;
                    if(p.special.time<=0){p.special=null;p.color=p.baseColor;}
                } else if(p.special?.type==='dash' && p.special.phase==='aim'){
                    const dx=(keys.has(r)?1:0)-(keys.has(l)?1:0), dy=(keys.has(d)?1:0)-(keys.has(u)?1:0);
                    if(dx||dy){
                        const targetAngle=Math.atan2(dy,dx);
                        let delta=targetAngle-p.special.angle;
                        delta=Math.atan2(Math.sin(delta),Math.cos(delta));
                        p.special.angle+=delta*Math.min(1,dt*12);
                    }
                } else if(p.special?.type==='dash' && p.special.phase==='charging'){
                    p.special.elapsed+=dt;
                    const duration = 5.0;
                    let progress = p.special.elapsed / duration;
                    if(progress >= 1) {
                        p.special = null;
                        p.color = p.baseColor;
                        continue;
                    }

                    let speedFactor = 0;
                    if(progress < 0.25) {
                        let t = progress / 0.25;
                        speedFactor = t * t * (3 - 2 * t);
                    } else if(progress > 0.75) {
                        let t = (1 - progress) / 0.25;
                        speedFactor = t * t * (3 - 2 * t);
                    } else {
                        speedFactor = 1.0;
                    }

                    p.x += p.special.vx * speedFactor * dt;
                    p.y += p.special.vy * speedFactor * dt;

                    if (!p.special.hasCrossedCenter) {
                        if (p.special.startSide === 'left' && p.x > wall) {
                            p.special.hasCrossedCenter = true;
                        } else if (p.special.startSide === 'right' && p.x < wall) {
                            p.special.hasCrossedCenter = true;
                        }
                    }

                    let wallHit = false;
                    const minAllowedX = 35;
                    const maxAllowedX = W - 35;

                    if (p.x < minAllowedX || p.x > maxAllowedX) {
                        p.x = clamp(p.x, minAllowedX, maxAllowedX);
                        p.special.vx = -p.special.vx;
                        wallHit = true;
                    }

                    if (p.special.hasCrossedCenter) {
                        if (p.special.startSide === 'left') {
                            if (p.x < wall) {
                                p.x = wall;
                                p.special.vx = -p.special.vx;
                                wallHit = true;
                            }
                        } else {
                            if (p.x > wall) {
                                p.x = wall;
                                p.special.vx = -p.special.vx;
                                wallHit = true;
                            }
                        }
                    }

                    if(p.y < 35 || p.y > H - 35) {
                        p.y = clamp(p.y, 35, H - 35);
                        p.special.vy = -p.special.vy;
                        wallHit = true;
                    }

                    if(wallHit) {
                        shake = 75; 
                        effects.push({type:'explosion', x:p.x, y:p.y, color:p.color, life:.3, maxLife:.3, radius:65});
                        for(let i=0; i<8; i++) {
                            effects.push({type:'spark', x:p.x, y:p.y, vx:(Math.random()-.5)*500, vy:(Math.random()-.5)*500, life:.35, maxLife:.35, radius:3+Math.random()*4, color:p.color});
                        }
                    }

                    trails.push({x:p.x, y:p.y, color:p.color, life:.35, maxLife:.35});
                    
                    for(let i=cannons.length-1; i>=0; i--){
                        if(Math.hypot(p.x - cannons[i].x, p.y - cannons[i].y) < 40){
                            cannons[i].hp -= 50;
                            shake = 60;
                            effects.push({type:'explosion', x:cannons[i].x, y:cannons[i].y, color:'#ff9f43', life:.3, maxLife:.3, radius:50});
                        }
                    }

                    const target = p === players.p1 ? players.p2 : players.p1;
                    p.special.hitCooldown -= dt;
                    if(Math.hypot(p.x - target.x, p.y - target.y) < 45 && p.special.hitCooldown <= 0){
                        if(!target.special || !['melee', 'sniper'].includes(target.special.type)){
                            target.hp = Math.max(0, target.hp - 20);
                            updateHealth();
                            shake = 75;
                            effects.push({type:'explosion', x:target.x, y:target.y, color:p.color, life:.35, maxLife:.35, radius:80});
                            if(target.hp === 0) end(p === players.p1 ? 'P1 WINS' : 'P2 WINS');
                        }
                        p.special.hitCooldown = .3;
                    }
                } else {
                    let moveX = 0, moveY = 0;
                    if(keys.has(l)) moveX -= 1;
                    if(keys.has(r)) moveX += 1;
                    if(keys.has(u)) moveY -= 1;
                    if(keys.has(d)) moveY += 1;

                    if(moveX !== 0 && moveY !== 0) {
                        moveX *= 0.7071;
                        moveY *= 0.7071;
                    }

                    const acceleration = 2500;
                    const friction = 12;

                    if (moveX !== 0) {
                        p.vx += moveX * acceleration * dt;
                    } else {
                        p.vx -= p.vx * friction * dt;
                    }

                    if (moveY !== 0) {
                        p.vy += moveY * acceleration * dt;
                    } else {
                        p.vy -= p.vy * friction * dt;
                    }

                    p.vx = clamp(p.vx, -maxSpeed, maxSpeed);
                    p.vy = clamp(p.vy, -maxSpeed, maxSpeed);

                    p.x += p.vx * dt;
                    p.y += p.vy * dt;

                    const minX=p.special?.type==='melee'?35:(p===players.p1?35:wall+35);
                    const maxX=p.special?.type==='melee'?W-35:(p===players.p1?wall-35:W-35);
                    
                    if(p.x <= minX || p.x >= maxX) {
                        p.x = clamp(p.x, minX, maxX);
                        p.vx = -p.vx * 0.2;
                    }
                    if(p.y <= 35 || p.y >= H - 35) {
                        p.y = clamp(p.y, 35, H - 35);
                        p.vy = -p.vy * 0.2;
                    }

                    if(Math.abs(p.x-oldX)+Math.abs(p.y-oldY)>.1)trails.push({x:oldX,y:oldY,color:p.color,life:.28,maxLife:.28});
                }

                if(p.special&&p.special.type!=='sniper'&&p.special.type!=='dash'){
                    p.special.time-=dt;
                    if(p.special.time<=0){
                        if(p.special.type==='melee')p.x=clamp(p.x,p===players.p1?35:wall+35,p===players.p1?wall-35:W-35);
                        p.special=null;p.color=p.baseColor;
                    }
                }
            }

            for(const p of Object.values(players)){if(p.ultCooldown>0)p.ultCooldown=Math.max(0,p.ultCooldown-dt);}

            for(let i=cannons.length-1;i>=0;i--){
                const cannon=cannons[i];
                if(cannon.hp <= 0){
                    effects.push({type:'explosion', x:cannon.x, y:cannon.y, color:'#ff9f43', life:.35, maxLife:.35, radius:60});
                    cannons.splice(i,1);
                    continue;
                }
                cannon.lastShot-=dt;
                if(cannon.lastShot<=0){
                    const target=cannon.owner===players.p1?players.p2:players.p1;
                    const flight=.4,fuse=.5;
                    bullets.push({x:cannon.x,y:cannon.y,landX:target.x,landY:target.y,vx:(target.x-cannon.x)/flight,vy:(target.y-cannon.y)/flight,age:0,flight,fuse,z:0,phase:'flying',dir:0,color:'#ff9f43',damage:20/3,cannon:true,bomb:true,owner:cannon.owner});
                    cannon.lastShot=1;
                }
            }

            for(let i=bullets.length-1;i>=0;i--){
                const b=bullets[i];
                if(b.bomb){
                    if(b.phase==='flying'){
                        b.age+=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
                        b.z=Math.sin(Math.min(b.age/b.flight,1)*Math.PI)*130;
                        if(b.age>=b.flight){b.x=b.landX;b.y=b.landY;b.z=0;b.phase='landed';b.age=0;}
                    }else{
                        b.age+=dt;
                        if(b.age>=b.fuse){
                            const target=b.owner===players.p1?players.p2:players.p1;
                            const inBlast=Math.hypot(b.x-target.x,b.y-target.y)<90;
                            const protectedTarget=target.special&&['melee','sniper','dash'].includes(target.special?.type);
                            if(inBlast&&!protectedTarget){target.hp=Math.max(0,target.hp-b.damage*3);updateHealth();if(target.hp===0)end(b.owner===players.p1?'P1 WINS':'P2 WINS');}
                            effects.push({type:'explosion',x:b.x,y:b.y,color:'#ff9f43',life:.35,maxLife:.35,radius:90});
                            shake=Math.max(shake,18);
                            bullets.splice(i,1);
                        }
                    }
                    continue;
                }
                
                let bulletHitCannon = false;
                for(let j=cannons.length-1; j>=0; j--){
                    if(Math.abs(b.x - cannons[j].x) < 20 && Math.abs(b.y - cannons[j].y) < 20){
                        cannons[j].hp -= b.damage;
                        bulletHitCannon = true;
                        break;
                    }
                }
                if(bulletHitCannon){
                    bullets.splice(i,1);
                    continue;
                }

                b.x+=(b.vx??b.dir*960)*dt;
                b.y+=(b.vy??0)*dt;
                let blocked=false;
                for(let j=i-1;j>=0;j--){
                    const o=bullets[j];
                    if(!b.cannon&&!o.cannon&&b.dir!==o.dir&&Math.abs(b.x-o.x)<28&&Math.abs(b.y-o.y)<8){
                        if(b.piercing){bullets.splice(j,1);continue;}
                        if(o.piercing){bullets.splice(i,1);blocked=true;break;}
                        bullets.splice(i,1);bullets.splice(j,1);blocked=true;break;
                    }
                }
                if(blocked){i=bullets.length;continue;}
                const target=b.owner===players.p1?players.p2:players.p1;
                if(hit(b,target)){
                    if(!target.special||!['melee','sniper'].includes(target.special.type)){
                        target.hp=Math.max(0,target.hp-b.damage);updateHealth();
                        if(target.hp===0)end(b.owner===players.p1?'P1 WINS':'P2 WINS');
                    }
                    bullets.splice(i,1);
                }else if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30)bullets.splice(i,1);
            }

            for(let i=trails.length-1;i>=0;i--){trails[i].life-=dt;if(trails[i].life<=0)trails.splice(i,1);}
            if(trails.length>MAX_TRAILS)trails.splice(0,trails.length-MAX_TRAILS);
            for(let i=effects.length-1;i>=0;i--){const effect=effects[i];effect.life-=dt;if(effect.vx){effect.x+=effect.vx*dt;effect.y+=effect.vy*dt;effect.vx*=.94;effect.vy*=.94;}if(effect.life<=0)effects.splice(i,1);}
        }

        function end(text){running=false;document.getElementById('winner').textContent=text;document.getElementById('overlay').classList.add('show');}

        function draw(){
            ctx.save();
            if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.8;}
            ctx.fillStyle='#111918';ctx.fillRect(0,0,W,H);
            const sniper=players.p1.special?.type==='sniper'?players.p1:players.p2.special?.type==='sniper'?players.p2:null;
            if(sniper){camera.x=sniper.special.cameraX;camera.y=sniper.special.cameraY;camera.zoom=sniper.special.zoom;}
            else{camera.x=W/2;camera.y=H/2;camera.zoom=1;}
            ctx.translate(W/2,H/2);ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);
            ctx.strokeStyle='#1d2a28';ctx.lineWidth=1;
            for(let x=0;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
            for(let y=0;y<H;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
            ctx.fillStyle='#273633';ctx.fillRect(wall-6,0,12,H);
            ctx.fillStyle='#435650';ctx.fillRect(wall-2,0,4,H);
            for(let y=18;y<H;y+=42){ctx.fillStyle='#9aafaa';ctx.fillRect(wall-1,y,2,12);}
            
            for(const trail of trails){
                ctx.globalAlpha=trail.life/trail.maxLife*.28;
                ctx.fillStyle=trail.color;
                ctx.beginPath();ctx.arc(trail.x,trail.y,22,0,Math.PI*2);ctx.fill();
                ctx.globalAlpha=1;
            }
            for(const cannon of cannons){
                ctx.fillStyle='#ff9f43';ctx.shadowColor='#ff9f43';ctx.shadowBlur=12;
                ctx.beginPath();ctx.arc(cannon.x,cannon.y,18,0,Math.PI*2);ctx.fill();
                ctx.fillRect(cannon.x-7,cannon.y-28,14,35);ctx.shadowBlur=0;
            }
            for(const effect of effects){
                const opacity=effect.life/effect.maxLife;
                ctx.globalAlpha=opacity;ctx.fillStyle=effect.color;ctx.shadowColor=effect.color;ctx.shadowBlur=effect.type==='flash'?10:6;
                if(effect.type==='flash'||effect.type==='burst'){ctx.beginPath();ctx.arc(effect.x,effect.y,18+opacity*24,0,Math.PI*2);ctx.fill();}
                else if(effect.type==='explosion'){ctx.lineWidth=7;ctx.beginPath();ctx.arc(effect.x,effect.y,effect.radius*(1-opacity*.3),0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(effect.x,effect.y,30*opacity,0,Math.PI*2);ctx.fill();}
                else if(effect.type==='melee'){ctx.lineWidth=5;ctx.beginPath();ctx.arc(effect.x,effect.y,effect.radius*(1-opacity),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=opacity*0.4;ctx.beginPath();ctx.arc(effect.x,effect.y,effect.radius,0,Math.PI*2);ctx.fill();}
                else{ctx.beginPath();ctx.arc(effect.x,effect.y,effect.radius*opacity,0,Math.PI*2);ctx.fill();}
                ctx.shadowBlur=0;ctx.globalAlpha=1;
            }
            for(const b of bullets){
                ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=6;
                if(b.bomb){
                    const height=b.z||0;
                    ctx.globalAlpha=.25;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(b.x,b.y+4,12+height*.03,4,0,0,Math.PI*2);ctx.fill();
                    ctx.globalAlpha=1;ctx.fillStyle='#ffcf5c';ctx.beginPath();ctx.arc(b.x,b.y-height,10+height*.025,0,Math.PI*2);ctx.fill();
                    ctx.fillStyle='#fff2a1';ctx.beginPath();ctx.arc(b.x-3,b.y-height-3,3,0,Math.PI*2);ctx.fill();
                }else if(b.cannon){ctx.beginPath();ctx.arc(b.x,b.y,7,0,Math.PI*2);ctx.fill();}
                else ctx.fillRect(b.x-14,b.y-3,28,6);
                ctx.shadowBlur=0;
            }
            for(const p of Object.values(players)){
                if(p.special?.type==='sniper'&&p.special.alpha<=.05)continue;
                ctx.save();
                ctx.globalAlpha=p.special?.type==='sniper'?p.special.alpha:1;
                ctx.translate(p.x,p.y);
                ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=12;
                ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();
                ctx.shadowBlur=0;ctx.fillStyle='#101615';
                ctx.beginPath();ctx.arc(p.dir*7,-6,4,0,Math.PI*2);ctx.fill();
                ctx.fillRect(p.dir*14-(p.dir>0?0:28),-4,28,8);
                ctx.restore();
            }
            ctx.fillStyle='#667873';ctx.font='11px Courier New';ctx.textAlign='center';ctx.fillText('NO CROSSING',wall,H-18);
            ctx.restore();
            
            if(sniper){
                ctx.save();
                const isReady = sniper.special.readyDelay <= 0;
                ctx.strokeStyle = isReady ? abilities.sniper.color : '#888888';
                ctx.shadowColor = isReady ? abilities.sniper.color : 'transparent';
                ctx.shadowBlur = isReady ? 10 : 0;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(W/2-45,H/2);ctx.lineTo(W/2+45,H/2);
                ctx.moveTo(W/2,H/2-45);ctx.lineTo(W/2,H/2+45);
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawTranscendenceRounds(){
            for(const b of bullets){
                if(!b.piercing)continue;
                ctx.save();ctx.fillStyle='#ff5ce1';ctx.shadowColor='#ff5ce1';ctx.shadowBlur=16;
                ctx.beginPath();ctx.arc(b.x,b.y,12,0,Math.PI*2);ctx.fill();
                ctx.fillStyle='#fff0ff';ctx.shadowBlur=0;
                ctx.beginPath();ctx.arc(b.x-3,b.y-3,4,0,Math.PI*2);ctx.fill();
                ctx.restore();
            }
        }

        function drawDashIndicators(){
            for(const p of Object.values(players)){
                if(p.special?.type!=='dash')continue;
                ctx.save();ctx.strokeStyle=p.color;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=12;
                if(p.special.phase==='aim'){
                    const x=p.x+Math.cos(p.special.angle)*42,y=p.y+Math.sin(p.special.angle)*42;
                    ctx.lineWidth=5;
                    ctx.beginPath();ctx.arc(p.x,p.y,30,p.special.angle-2.6,p.special.angle+2.6);ctx.stroke();
                    ctx.beginPath();ctx.moveTo(x+Math.cos(p.special.angle)*16,y+Math.sin(p.special.angle)*16);
                    ctx.lineTo(x+Math.cos(p.special.angle+2.5)*10,y+Math.sin(p.special.angle+2.5)*10);
                    ctx.lineTo(x+Math.cos(p.special.angle-2.5)*10,y+Math.sin(p.special.angle-2.5)*10);
                    ctx.closePath();ctx.fill();
                }
                ctx.restore();
            }
        }

        function recoverGame(){
            bullets.length=0;effects.length=0;
            for(const p of Object.values(players)){
                if(!Number.isFinite(p.x)||!Number.isFinite(p.y)){p.x=p===players.p1?150:W-150;p.y=H/2;}
                if(p.special?.type==='dash'){p.special=null;p.color=p.baseColor;}
            }
        }

        function loop(now){
            const dt=Math.min((now-last)/1000,.1);
            last=now;
            if(running){
                try{
                    update(dt,now);
                    draw();
                    drawTranscendenceRounds();
                    drawDashIndicators();
                    updateUltimateStatus();
                }catch(err){
                    console.error(err);
                    recoverGame();
                }
            }else{
                draw();
            }
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
